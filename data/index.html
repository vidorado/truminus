<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruMinus</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── Barra superior ─────────────────────────────────────────────────── -->
<header class="topbar">
  <img src="truminus-logo.png" alt="TruMinus" class="logo">
  <div class="topbar-temps">
    <span class="tbadge">&#127777; <span id="room_temp">--</span>&nbsp;°C</span>
    <span class="tbadge tbadge-agua">&#128167; <span id="water_temp">--</span>&nbsp;°C</span>
  </div>
  <div class="topbar-icons">
    <span id="dot-wifi" class="sdot sdot-err" title="WiFi">W</span>
    <span id="dot-lin"  class="sdot sdot-err" title="LIN">L</span>
  </div>
</header>

<!-- ── Paneles principales ────────────────────────────────────────────── -->
<main class="panels">

  <!-- Panel izquierdo — CALEFACCIÓN -->
  <section class="panel">
    <div class="p-title">CALEFACCIÓN</div>

    <button id="heatBtn" class="btn-heat btn-off" onclick="toggleHeating()">APAGADO</button>

    <!-- Setpoint temperatura (visible sólo cuando heat ON) -->
    <div id="spRow" class="sp-row vis-hidden">
      <button class="btn-step" onclick="changeTemp(-0.5)">&#9660;</button>
      <span id="spVal" class="sp-val">20.0&nbsp;°C</span>
      <button class="btn-step" onclick="changeTemp(0.5)">&#9650;</button>
    </div>

    <div class="p-sep"></div>
    <div class="sec-lbl">VENTILADOR</div>

    <!-- Ventilador modo calefacción: Eco | Alto | Apag. (heat ON) -->
    <div id="fanHeatRow" class="btn-row vis-hidden">
      <button id="fhEco"  class="btn-fan" onclick="setFan('eco')">Eco</button>
      <button id="fhHigh" class="btn-fan" onclick="setFan('high')">Alto</button>
      <button id="fhOff"  class="btn-fan" onclick="setFan('off')">Apag.</button>
    </div>

    <!-- Ventilador modo standby: Off | On (heat OFF) -->
    <div id="fanSbyRow" class="btn-row">
      <button id="fsBtnOff" class="btn-fan btn-sel" onclick="setFanSby('off')">Off</button>
      <button id="fsBtnOn"  class="btn-fan"         onclick="setFanSby('on')">On</button>
    </div>
    <!-- Control nivel 1-10 (visible cuando standby + fan On) -->
    <div id="fanLvlRow" class="sp-row vis-hidden">
      <button class="btn-step" onclick="changeFanLvl(-1)">&#9660;</button>
      <span id="fanLvlVal" class="sp-val">5</span>
      <button class="btn-step" onclick="changeFanLvl(1)">&#9650;</button>
    </div>
  </section>

  <!-- Panel derecho — AGUA CALIENTE -->
  <section class="panel">
    <div class="p-title">AGUA CALIENTE</div>

    <!-- 4 botones de caldera en rejilla 2×2 -->
    <div class="boiler-grid">
      <button id="bOff"   class="btn-boiler" onclick="setBoiler('off')">Apag.</button>
      <button id="bEco"   class="btn-boiler" onclick="setBoiler('eco')">40&nbsp;°C</button>
      <button id="bHigh"  class="btn-boiler" onclick="setBoiler('high')">60&nbsp;°C</button>
      <button id="bBoost" class="btn-boiler" onclick="setBoiler('boost')">60&nbsp;°C&nbsp;&#9889;</button>
    </div>

    <div class="p-sep"></div>
    <div class="sec-lbl">ENERGÍA</div>

    <select id="energyCombo" class="sel-dark" onchange="setEnergyCombo(this.value)">
      <option value="0">Gas</option>
      <option value="1">Gas + Elec. 850 W</option>
      <option value="2">Gas + Elec. 1700 W</option>
      <option value="3">Elec. 850 W</option>
      <option value="4">Elec. 1700 W</option>
    </select>
  </section>

</main>

<!-- ── Tira de estado / error ─────────────────────────────────────────── -->
<div class="info-strip">
  <span id="current_state" class="state-txt"></span>
  <span id="error_line"    class="err-txt"></span>
</div>

<!-- ── Diagnóstico colapsable ─────────────────────────────────────────── -->
<details class="diag-wrap">
  <summary>Diagnóstico</summary>
  <table id="detailsTable">
    <tr><th>Campo</th><th>Valor</th></tr>
  </table>
</details>

<!-- ── Barra inferior fija ────────────────────────────────────────────── -->
<footer class="statusbar">
  <span id="statusMsg" class="sb-msg"></span>
  <a href="#" onclick="openPortal(); return false;">Config portal</a>
</footer>

<!-- ── Modal (conexión / error LIN) ──────────────────────────────────── -->
<div id="modal" class="modal">
  <div class="modal-box">
    <p id="modal-text"></p>
  </div>
</div>

<script src="reconnecting-websocket.min.js"></script>
<script src="errors.js"></script>
<script src="script.js"></script>
</body>
</html>
