<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f22">
<link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
<link rel="shortcut icon" href="/icons/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="TruMinus" />
<link rel="manifest" href="/icons/site.webmanifest" />
<title>TruMinus</title>
<link rel="stylesheet" href="styles.css?v=dab27a2e">
</head>
<body>

<!-- ── Top bar — mirrors main/p4display.cpp top band ─────────────────────── -->
<header class="topbar">
  <div class="topbar-temps">
    <span id="ind-tint" class="tbadge tbadge-ind"><i class="fi">&#xF043;</i></span>
    <span id="ind-fire" class="tbadge tbadge-ind"><i class="fi">&#xF7E4;</i></span>
    <span class="tbadge"><i class="fi">&#xE3AF;</i> <span id="room_temp">--</span>&nbsp;°C</span>
    <span class="tbadge tbadge-ext"><i class="fi">&#xF2C9;</i><i class="fi fi-sm">&#xF2F6;</i> <span id="outdoor_temp">--</span>&nbsp;°C</span>
  </div>
  <div class="topbar-icons">
    <span id="dot-cloud" class="sdot sdot-dis" title="Tunnel"><i class="fi">&#xF0C2;</i></span>
    <span id="dot-bt"   class="sdot sdot-dis" title="Bluetooth"><i class="fib">&#xF293;</i></span>
    <span id="dot-wifi" class="sdot sdot-err" title="WiFi"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M1 9l2 2c5-5 13-5 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 0 0-6 0zm-4-4l2 2a7 7 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="currentColor"/></svg></span>
    <span id="dot-lin"  class="sdot sdot-err" title="LIN"><i class="fi">&#xF074;</i></span>
  </div>
</header>

<!-- ── LCD-mirror layout: 800 px canvas, two rows with different column widths
       that reserve the empty right-hand area the physical screen leaves for
       future controls. ───────────────────────────────────────────────────── -->
<main class="lcd">

  <!-- Row 1: HEATING (301 px) + HOT WATER (350 px) + AGUA L. (149 px) -->
  <div class="row row1">

    <!-- HEATING panel (left/top) -->
    <section class="panel panel-heat">
      <div class="p-title" data-i18n="heating">CALEFACCIÓN</div>

      <button id="heatBtn" class="btn-heat btn-off" onclick="toggleHeating()">APAGADO</button>

      <!-- Setpoint row (visible only when heat is on) -->
      <div id="spRow" class="sp-row sp-hidden">
        <button class="btn-step" onclick="changeTemp(-0.5)">&#9660;</button>
        <span id="spVal" class="sp-val">20.0&nbsp;°C</span>
        <button class="btn-step" onclick="changeTemp(0.5)">&#9650;</button>
      </div>
    </section>

    <!-- HOT WATER panel (right/top) — grid: title over boiler buttons on
         the left, water tank spans the full panel height on the right. -->
    <section class="panel panel-water">
      <div class="p-title" data-i18n="hot_water">AGUA CALIENTE</div>

      <div class="boiler-grid">
        <button id="bOff"   class="btn-boiler" onclick="setBoiler('off')"   data-i18n="boiler_off">Apag.</button>
        <button id="bEco"   class="btn-boiler" onclick="setBoiler('eco')">40&nbsp;°C</button>
        <button id="bHigh"  class="btn-boiler" onclick="setBoiler('high')">60&nbsp;°C</button>
        <button id="bBoost" class="btn-boiler" onclick="setBoiler('boost')">60&nbsp;°C&nbsp;<i class="fi">&#xF0E7;</i></button>
      </div>

      <div class="water-temp-bar-wrap">
        <div class="water-temp-lbl"><span id="water_temp_val">--</span>&thinsp;°C</div>
        <div class="water-temp-body">
          <div id="water_temp_fill" class="water-temp-fill"></div>
        </div>
      </div>
    </section>

    <!-- AGUA L. panel (right slot of row 1) — fresh-water tank fill level
         from a BTHome BLE sensor.  Horizontal "jug" silhouette with a small
         neck cap on top-right; vertical fill grows from bottom. -->
    <section class="panel panel-tank">
      <div class="p-title" data-i18n="tank_l">AGUA LIMPIA</div>
      <div class="tank-pct"><span id="tank_pct_val">--</span>&nbsp;%</div>
      <div class="tank-wrap">
        <div class="tank-neck"></div>
        <div class="tank-body">
          <div id="tank_fill" class="tank-fill"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- Row 2: FAN (213 px) + SOLAR (304 px) + INVERSOR (283 px) -->
  <div class="row row2">

    <!-- FAN panel (left/bottom) -->
    <section class="panel panel-fan">
      <div class="p-title" data-i18n="fan">VENTILADOR</div>

      <!-- Heat ON: Eco | Alto -->
      <div id="fanHeatRow" class="btn-row vis-hidden">
        <button id="fhEco"  class="btn-fan" onclick="setFan('eco')"  data-i18n="fan_eco">Eco</button>
        <button id="fhHigh" class="btn-fan" onclick="setFan('high')" data-i18n="fan_high">Alto</button>
      </div>

      <!-- Heat OFF: Off | On -->
      <div id="fanSbyRow" class="btn-row">
        <button id="fsBtnOff" class="btn-fan btn-sel" onclick="setFanSby('off')" data-i18n="fan_off">Off</button>
        <button id="fsBtnOn"  class="btn-fan"         onclick="setFanSby('on')"  data-i18n="fan_on">On</button>
      </div>

      <!-- Level 1-10 (visible when standby + On) -->
      <div id="fanLvlRow" class="sp-row vis-hidden">
        <button class="btn-step" onclick="changeFanLvl(-1)">&#9660;</button>
        <span id="fanLvlVal" class="sp-val">5</span>
        <button class="btn-step" onclick="changeFanLvl(1)">&#9650;</button>
      </div>
    </section>

    <!-- SOLAR panel (right/bottom) — compact: state + charge + yield -->
    <section class="panel panel-solar">
      <div class="p-title" data-i18n="solar">SOLAR</div>
      <div class="solar-col">
        <div id="solar_state" class="solar-line solar-status">--</div>
        <div class="solar-line solar-load">
          <span id="solar_battA">--</span>&thinsp;A&ensp;/&ensp;<span id="solar_pvW">--</span>&thinsp;W
        </div>
        <div class="solar-line solar-prod">
          <span id="solar_kWh">--</span>&thinsp;kWh
        </div>
      </div>
    </section>

    <!-- BATERÍA panel — SOC bar + flow line + CARGA port -->
    <section class="panel panel-batt">
      <div class="p-title" data-i18n="battery">BATERÍA</div>
      <div class="batt-layout">
        <div class="batt-col">
          <div id="batt_soc" class="batt-soc-lbl">--%</div>
          <div class="batt-body">
            <div id="batt_fill" class="batt-fill"></div>
          </div>
        </div>
        <div id="batt_flow" class="batt-flow"></div>
        <div id="batt_pwr_port" class="inv-port batt-pwr-port">
          <div id="batt_pwr_hdr" class="inv-port-hdr" data-i18n="batt_charge">CARGA</div>
          <div class="inv-port-val"><span id="batt_pwr_w">--</span>&thinsp;W</div>
        </div>
      </div>
    </section>

    <!-- INVERSOR panel (right slot of row 2) — Victron Multiplus / VE.Bus.
         Read-only: ON/OFF needs VE.Bus GATT which isn't implemented yet,
         so the buttons render disabled.  Three I/O boxes (RED/CARGA/BAT)
         flank a central Multiplus icon; horizontal flow lines pulse when
         the corresponding port carries non-trivial power. -->
    <section class="panel panel-inv">
      <div class="p-title" data-i18n="inverter">INVERSOR</div>

      <div class="inv-diagram">
        <div id="inv_mains_port" class="inv-port inv-mains">
          <div class="inv-port-hdr" data-i18n="inv_mains">RED</div>
          <div class="inv-port-val"><span id="inv_mains_w">--</span>&thinsp;W</div>
        </div>

        <div class="inv-mid">
          <div id="flow_mains" class="inv-flow inv-flow-left"></div>
          <div class="inv-mpx">
            <div class="inv-mpx-ear inv-mpx-ear-l"></div>
            <div class="inv-mpx-ear inv-mpx-ear-r"></div>
            <div class="inv-mpx-top">
              <div class="inv-mpx-bar"></div>
              <div class="inv-mpx-display"></div>
              <div id="inv_state" class="inv-mpx-state">--</div>
            </div>
            <div class="inv-mpx-foot"></div>
          </div>
          <div id="flow_load"  class="inv-flow inv-flow-right inv-flow-upper"></div>
          <div id="flow_batt"  class="inv-flow inv-flow-right inv-flow-lower"></div>
        </div>

        <div class="inv-right">
          <div id="inv_load_port" class="inv-port inv-load">
            <div class="inv-port-hdr" data-i18n="inv_load">CARGA</div>
            <div class="inv-port-val"><span id="inv_load_w">--</span>&thinsp;W</div>
          </div>
          <div id="inv_batt_port" class="inv-port inv-batt">
            <div class="inv-port-hdr" data-i18n="inv_batt">BAT.</div>
            <div class="inv-port-val"><span id="inv_batt_w">--</span>&thinsp;W</div>
          </div>
        </div>
      </div>
    </section>
  </div>

</main>

<!-- ── Error modal ────────────────────────────────────────────────────── -->
<div id="err-modal" class="err-modal-overlay hidden">
  <div class="err-modal-box">
    <div id="err-modal-title" class="err-modal-title">ERROR</div>
    <div id="err-modal-sub"   class="err-modal-sub"></div>
    <div id="err-modal-desc"  class="err-modal-desc"></div>
    <button class="err-modal-btn" onclick="acknowledgeError()" data-i18n="accept">Aceptar</button>
  </div>
</div>

<!-- ── Fixed bottom bar ──────────────────────────────────────────────── -->
<footer class="statusbar">
  <div class="sb-left">
    <span id="statusMsg" class="sb-msg"></span>
    <span id="deviceIp"  class="sb-ip"></span>
    <span id="error_line" class="err-txt"></span>
  </div>
  <span class="footer-logo" aria-label="TruMinus">TruMinus</span>
</footer>

<script src="reconnecting-websocket.min.js?v=a1a77c36"></script>
<script src="errors.js?v=ddd3f31a"></script>
<script src="i18n.js?v=45401053"></script>
<script src="script.js?v=ccf6010d"></script>
</body>
</html>
