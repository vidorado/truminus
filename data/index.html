<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruMinus</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── Top bar ────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-temps">
    <span id="ind-tint" class="tbadge tbadge-ind"><i class="fi">&#xF043;</i></span>
    <span id="ind-fire" class="tbadge tbadge-ind"><i class="fi">&#xF06D;</i></span>
    <span class="tbadge"><i class="fi">&#xF015;</i> <span id="room_temp">--</span>&nbsp;°C</span>
    <span class="tbadge tbadge-ext"><i class="fi">&#xF2C9;</i><i class="fi fi-sm">&#xF054;</i> <span id="outdoor_temp">--</span>&nbsp;°C</span>
  </div>
  <div class="topbar-icons">
    <span id="dot-wifi" class="sdot sdot-err" title="WiFi"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M1 9l2 2c5-5 13-5 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 0 0-6 0zm-4-4l2 2a7 7 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="currentColor"/></svg></span>
    <span id="dot-mqtt" class="sdot sdot-dis" title="MQTT"><i class="fi">&#xF079;</i></span>
    <span id="dot-lin"  class="sdot sdot-err" title="LIN"><i class="fi">&#xF074;</i></span>
  </div>
</header>

<!-- ── Main panels ────────────────────────────────────────────────────── -->
<main class="panels">

  <!-- Left panel — HEATING -->
  <section class="panel">
    <div class="p-title" data-i18n="heating">CALEFACCIÓN</div>

    <button id="heatBtn" class="btn-heat btn-off" onclick="toggleHeating()">APAGADO</button>

    <!-- Temperature setpoint (visible only when heat ON) -->
    <div id="spRow" class="sp-row vis-hidden">
      <button class="btn-step" onclick="changeTemp(-0.5)">&#9660;</button>
      <span id="spVal" class="sp-val">20.0&nbsp;°C</span>
      <button class="btn-step" onclick="changeTemp(0.5)">&#9650;</button>
    </div>

    <div class="p-sep"></div>
    <div class="sec-lbl" data-i18n="fan">VENTILADOR</div>

    <!-- Fan heating mode: Eco | High (heat ON) -->
    <div id="fanHeatRow" class="btn-row vis-hidden">
      <button id="fhEco"  class="btn-fan" onclick="setFan('eco')"  data-i18n="fan_eco">Eco</button>
      <button id="fhHigh" class="btn-fan" onclick="setFan('high')" data-i18n="fan_high">Alto</button>
    </div>

    <!-- Fan standby mode: Off | On (heat OFF) -->
    <div id="fanSbyRow" class="btn-row">
      <button id="fsBtnOff" class="btn-fan btn-sel" onclick="setFanSby('off')" data-i18n="fan_off">Off</button>
      <button id="fsBtnOn"  class="btn-fan"         onclick="setFanSby('on')"  data-i18n="fan_on">On</button>
    </div>
    <!-- Level control 1-10 (visible when standby + fan On) -->
    <div id="fanLvlRow" class="sp-row vis-hidden">
      <button class="btn-step" onclick="changeFanLvl(-1)">&#9660;</button>
      <span id="fanLvlVal" class="sp-val">5</span>
      <button class="btn-step" onclick="changeFanLvl(1)">&#9650;</button>
    </div>
  </section>

  <!-- Right panel — HOT WATER -->
  <section class="panel">
    <div class="p-title" data-i18n="hot_water">AGUA CALIENTE</div>

    <!-- 4 boiler buttons in a 2×2 grid -->
    <div class="boiler-grid">
      <button id="bOff"   class="btn-boiler" onclick="setBoiler('off')"   data-i18n="boiler_off">Apag.</button>
      <button id="bEco"   class="btn-boiler" onclick="setBoiler('eco')">40&nbsp;°C</button>
      <button id="bHigh"  class="btn-boiler" onclick="setBoiler('high')">60&nbsp;°C</button>
      <button id="bBoost" class="btn-boiler" onclick="setBoiler('boost')">60&nbsp;°C&nbsp;<i class="fi">&#xF0E7;</i></button>
    </div>

  </section>

  <!-- Solar charge + battery panel — full width, hidden until configured -->
  <section id="solar-panel" class="panel panel-full vis-hidden">

    <!-- Victron solar charger -->
    <div id="solar-section" class="solar-section vis-hidden">
      <div class="solar-section-hdr">
        <span class="p-title" data-i18n="solar_charge">CARGA SOLAR</span>
        <span id="solar_state" class="solar-state-lbl"></span>
      </div>
      <div class="solar-row">
        <span class="solar-kv">&#9728; <b id="solar_pvW">--</b>&thinsp;W</span>
        <span class="solar-kv">&#9889; <b id="solar_kWh">--</b>&thinsp;kWh</span>
        <span class="solar-kv">&#9889; <b id="solar_battV">--</b>&thinsp;V&ensp;<b id="solar_battA">--</b>&thinsp;A</span>
      </div>
    </div>

    <!-- Ultimatron battery BMS -->
    <div id="batt-section" class="solar-section vis-hidden">
      <div class="p-sep" id="batt-sep" style="display:none"></div>
      <div class="solar-section-hdr">
        <span class="p-title" data-i18n="battery">BATERÍA</span>
        <span id="batt_soc" class="batt-soc-lbl"></span>
      </div>
      <div class="solar-row">
        <span class="solar-kv"><b id="batt_V">--</b>&thinsp;V&ensp;<b id="batt_A">--</b>&thinsp;A</span>
        <span class="solar-kv">&#x1F321;&#xFE0E; <b id="batt_tempC">--</b>&thinsp;°C</span>
      </div>
    </div>

  </section>

</main>

<!-- ── Error modal ────────────────────────────────────────────────────── -->
<div id="err-modal" class="err-modal-overlay hidden">
  <div class="err-modal-box">
    <div id="err-modal-title" class="err-modal-title">ERROR</div>
    <div id="err-modal-sub"   class="err-modal-sub"></div>
    <div id="err-modal-desc"  class="err-modal-desc"></div>
    <button class="err-modal-btn" onclick="acknowledgeError()" data-i18n="accept">Aceptar</button>
  </div>
</div>

<!-- ── Status strip / error ───────────────────────────────────────────── -->
<div class="info-strip">
  <span id="error_line" class="err-txt"></span>
</div>

<!-- ── Fixed bottom bar ──────────────────────────────────────────────── -->
<footer class="statusbar">
  <div class="sb-left">
    <span id="statusMsg" class="sb-msg"></span>
    <span id="deviceIp"  class="sb-ip"></span>
  </div>
  <img src="truminus-logo.png" alt="TruMinus" class="footer-logo">
</footer>

<script src="reconnecting-websocket.min.js"></script>
<script src="errors.js"></script>
<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
