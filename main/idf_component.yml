dependencies:
  idf: '>=5.3'

  # JC4880P443C board support package.  Not published in the Espressif
  # Component Registry, so we pull it directly from the upstream git repo
  # and pin the exact commit.  scripts/apply_patches.py then adapts
  # bsp_display.c to IDF 6.0 (see patches/jc4880_bsp_idf6.patch).
  #
  # Transitive deps (esp_lcd_st7701, esp_lcd_touch, esp_lcd_touch_gt911,
  # esp_lvgl_port, lvgl) are listed in the BSP's own idf_component.yml and
  # are fetched from the registry automatically.
  jc4880_bsp:
    git: https://github.com/csvke/esp32_p4_jc4880p433c_bsp.git
    version: 932af3aaee532af144087b6126aaa48eb9124be4
    path: .

  # WiFi via ESP32-C6 co-processor over SDIO (ESP-Hosted architecture).
  # Standard esp_wifi_* APIs work transparently through esp_wifi_remote.
  espressif/esp_hosted:
    version: '>=1.0.0'
  # Pinned: this is the C6-hosted WiFi shim. An open '>=' constraint silently
  # floated it 1.5.3 -> 1.6.0 on 2026-06-04 during a local build. Pin it so the
  # WiFi stack is reproducible; bump deliberately and review the lock diff.
  espressif/esp_wifi_remote:
    version: '==1.6.0'

  # LittleFS filesystem for web assets (HTML/CSS/JS served by webserver.cpp).
  # The image is built from <project>/data/ and flashed to the `littlefs`
  # partition defined in partitions_16MB.csv.  Updating data/ no longer
  # requires reflashing the firmware app — only the LittleFS image.
  joltwallet/littlefs:
    version: '>=1.10.0'

  # IDF-native C++ NimBLE wrapper (no Arduino deps).
  # BLE HCI is routed to the ESP32-C6 co-processor via ESP-Hosted virtual HCI.
  # Requires CONFIG_BT_ENABLED=y + CONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE=y
  # and C6 slave firmware built with BT support (use 'make build-c6').
  h2zero/esp-nimble-cpp:
    version: '>=2.0.0'
  espressif/cjson: '*'

  # WSS reverse-tunnel transport — connects to the Plesk-hosted Node.js
  # bridge (server/app.js) so the local HTTP server is reachable through
  # CGNAT.  See main/wstunnel.cpp.
  espressif/esp_websocket_client: '*'
