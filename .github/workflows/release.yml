# Build the ESP32-P4 firmware on every version tag and attach the resulting
# binary to the GitHub Release as `truminus.bin` — the deterministic asset
# name the device downloads during self-OTA (see main/p4_ota.cpp).
#
# Tagging flow:
#   git tag 1.1.0 && git push origin 1.1.0
# creates/updates the "1.1.0" release with truminus.bin attached.  The running
# firmware compares its embedded version (PROJECT_VER, from `git describe`)
# against the latest tag and offers the update.
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # 1.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+'     # v1.1.0 (also accepted by the parser)

permissions:
  contents: write                   # needed to create/update the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags so `git describe` yields the clean version)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Persist the compiler cache across runs.  idf.py already enables ccache
      # inside the IDF container (-DCCACHE_ENABLE=True); we just redirect its
      # store into the workspace (CCACHE_DIR below) so this step can save/
      # restore it.  Between our releases only main/ changes — mbedtls, lvgl,
      # nimble and the esp-idf libs are reused from cache, cutting the build
      # from ~5-6 min to ~1-2 min.  Key is per-commit (always a fresh save);
      # restore-keys falls back to the most recent previous cache.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-esp32p4-${{ github.sha }}
          restore-keys: |
            ccache-esp32p4-

      # Skip re-downloading managed_components when the dependency set is
      # unchanged (keyed on the component manifest + lockfile).
      - name: Cache managed_components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: idf-components-${{ hashFiles('main/idf_component.yml', 'dependencies.lock') }}
          restore-keys: |
            idf-components-

      - name: Build firmware (ESP-IDF v6.0, target esp32p4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.0
          target: esp32p4
          # All ccache settings MUST be exported here — this action does not
          # forward the step `env:` into the container (see ci.yml for the full
          # rationale: mounted path is /app/<owner>/<repo>, and the fresh-
          # extracted container needs content-based compiler/header hashing).
          # littlefs-python is required by the joltwallet LittleFS image step.
          command: >-
            export CCACHE_DIR="$PWD/.ccache" CCACHE_BASEDIR="$PWD"
            CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=true
            CCACHE_SLOPPINESS=time_macros,locale,include_file_ctime,include_file_mtime
            CCACHE_MAXSIZE=500M IDF_CCACHE_ENABLE=1
            && pip install littlefs-python && idf.py build && ccache -s

      # Web-asset OTA payload. truminus.bin (the app image) stays uncompressed
      # so older firmware keeps updating via esp_https_ota unchanged. The
      # LittleFS image is ~8 MB but ~95% 0xFF padding, so gzip shrinks it to a
      # few hundred KB; the device inflates it on-flash. littlefs.ver carries
      # the content hash baked into the image (data/fs.ver) so the device only
      # downloads littlefs.bin.gz when its own /littlefs/fs.ver differs.
      - name: Prepare LittleFS OTA assets
        run: |
          gzip -9 -n -c build/littlefs.bin > build/littlefs.bin.gz
          cp data/fs.ver build/littlefs.ver
          ls -l build/littlefs.bin build/littlefs.bin.gz build/littlefs.ver

      - name: Attach OTA assets to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/truminus.bin
            build/littlefs.bin.gz
            build/littlefs.ver
          fail_on_unmatched_files: true
