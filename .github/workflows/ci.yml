# Firmware build — MANUAL ONLY (workflow_dispatch).
#
# This used to run on every push to master to keep a warm ccache on the
# default branch, which release.yml's tag runs then restored (same key prefix),
# cutting releases from ~5-6 min cold to ~1-2 min.  But the usual flow is
# "commit + push master + push tag" in one go, which fired BOTH this build and
# the release build for the same commit — two builds per release.  So this no
# longer auto-runs; releases are a single build.
#
# This does NOT mean releases are always cold.  GitHub caches are scoped per
# ref: a tag ref can't read another tag's cache, but ANY ref can read the
# default-branch (master) cache.  release.yml's `restore-keys: ccache-esp32p4-`
# therefore still restores the most recent surviving master-scoped cache — the
# one left by the last run of THIS workflow — so tag builds stay ~1-2 min while
# that cache lives (GitHub evicts caches after 7 days idle, or by LRU past the
# 10 GB repo limit).  Only once it's evicted does a release compile cold.
#
# Run this manually (Actions → ci → Run workflow on master) to refresh that
# default-branch cache whenever a release build has gone (or is about to go)
# cold.
name: ci

on:
  workflow_dispatch:

# A newer push to master cancels an in-progress build so rapid commits don't
# stack up CI minutes; the latest commit is what we want cached anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags so `git describe` yields the clean version)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same key prefix as release.yml so the tag-ref release builds restore
      # this default-branch cache via restore-keys.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-esp32p4-${{ github.sha }}
          restore-keys: |
            ccache-esp32p4-

      - name: Cache managed_components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: idf-components-${{ hashFiles('main/idf_component.yml', 'dependencies.lock') }}
          restore-keys: |
            idf-components-

      - name: Build firmware (ESP-IDF v6.0, target esp32p4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.0
          target: esp32p4
          # CRITICAL: this action does NOT forward the step `env:` into the
          # container — only what we export inside `command` reaches ccache
          # (verified via `ccache -p`: env-block CCACHE_* showed as defaults).
          # So every ccache setting must be exported here:
          #  - CCACHE_DIR/BASEDIR: the action mounts the repo at /app/<owner>/
          #    <repo> (not /github/workspace); $PWD is that mounted dir, which
          #    is also what actions/cache persists as `.ccache`.
          #  - COMPILERCHECK=content + SLOPPINESS=include_file_*time: the IDF
          #    container is extracted fresh each run, resetting compiler/header
          #    mtimes; mtime-based checks then miss everything. Hash by content.
          command: >-
            export CCACHE_DIR="$PWD/.ccache" CCACHE_BASEDIR="$PWD"
            CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=true
            CCACHE_SLOPPINESS=time_macros,locale,include_file_ctime,include_file_mtime
            CCACHE_MAXSIZE=500M IDF_CCACHE_ENABLE=1
            && pip install littlefs-python && idf.py build && ccache -s
