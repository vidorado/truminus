; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.10.0
; for the C3 Supermini
;board =  dfrobot_beetle_esp32c3
; for the goouuu esp32 c3
board = esp32-c3-devkitc-02
; for the wroom 32
;board = esp32doit-devkit-v1
framework = arduino
;board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
;doesn't work with the esp32 c3
monitor_filters = esp32_exception_decoder
;only for the esp32doit-devkit-v1 board
;monitor_rts = 0
;monitor_dtr = 0
build_type = release
; use -DGOOUUUC3 for the goouuu esp32 c3, -DC3SUPERMINI for the c3 supermini, -DWROOM32 for the Wroom32
build_flags =
	-std=gnu++17
	-Wfatal-errors
	-DCORE_DEBUG_LEVEL=0
	-DWS_MAX_QUEUED_MESSAGES=256
	-DGOOUUUC3
	-DWEBSERVER
	-DAUTODISCOVERY
	-DLOG_LOCAL_LEVEL=0
	; -DBLE to enable BLE (Victron + Ultimatron), comment to disable
	; -DBLE
;add
;	-DARDUINO_USB_MODE=1
;	-DARDUINO_USB_CDC_ON_BOOT=1
;for the c3 supermini
;
;add
;	-DCOMBIGAS for combi gas firmware V05.00.00 (just for testing, not working yet)

build_unflags = 
	-std=gnu++11
lib_deps = 
	cyijun/ESP32MQTTClient@^0.3.0

	;ottowinter/ESPAsyncWebServer-esphome@^3.1.0 <--crashes and burns
	mathieucarbou/ESP Async WebServer@^2.9.0
 	bblanchon/ArduinoJson@^7.0.4

[env:cyd]
; CYD (ESP32-2432S028R) pin assignments are defined in src/main.cpp:
extra_scripts = pre:scripts/compress_fs.py
;   LIN bus UART: TX=GPIO27, RX=GPIO22 (CN2/P3 connectors)
;   Outdoor temp sensor (AM2301): DATA=GPIO17 (repurposed from RGB LED blue)
board = esp32-2432S028R
board_build.partitions = min_spiffs.csv
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
	-std=gnu++17
	-Wfatal-errors
	-DCORE_DEBUG_LEVEL=1
	-DWS_MAX_QUEUED_MESSAGES=16
	-DCYD
	-DWEBSERVER
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DLV_FONT_MONTSERRAT_12=1
	-DLV_FONT_MONTSERRAT_14=1
	-DLV_FONT_MONTSERRAT_16=1
	-DLV_FONT_MONTSERRAT_20=1
	-DLV_FONT_MONTSERRAT_28=1
	-DLV_MEM_SIZE=32768
	-DLVGL_BUFFER_PIXELS="(DISPLAY_WIDTH*DISPLAY_HEIGHT/10)"
	-DCONFIG_ASYNC_TCP_STACK_SIZE=6144
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=8
	-DNO_MQTT
build_unflags =
	-std=gnu++11
	-DLVGL_BUFFER_PIXELS=(DISPLAY_WIDTH*DISPLAY_HEIGHT/4)
lib_deps =

	mathieucarbou/ESP Async WebServer@^2.9.0
	bblanchon/ArduinoJson@^7.0.4
	; Branch develop tiene fixes para ESP-IDF 5.x (issue rzeldent#250).
	; El tag 2.1.1 está congelado en API antiguo (.dc_as_cmd_phase,
	; spi_common_internal.h) y no compila contra pioarduino para C5.
	https://github.com/rzeldent/esp32-smartdisplay.git#develop
	https://github.com/beegee-tokyo/DHTesp.git

[env:cyd_c5]
; CYD_C5 (ESP32-C5-WROOM-1, NM-CYD-C5 by RockBase)
; Requires pioarduino platform for ESP32-C5 / Arduino 3.x support.
; Ref: https://github.com/RockBase-iot/NM-CYD-C5
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.36
board = nm_cyd_c5
board_build.partitions = partitions_16MB.csv
; Enable 8 MB QSPI PSRAM (R8 part of the N16R8 module).
; Frees internal SRAM for the WiFi driver and gives us several MB of extra
; heap for BLE buffers, big strings, etc.
board_build.arduino.memory_type = qio_qspi
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
extra_scripts =
	pre:scripts/patch_pioarduino.py
	pre:scripts/compress_fs.py
build_flags =
	-std=gnu++17
	-Wfatal-errors
	-DCORE_DEBUG_LEVEL=1
	-DWS_MAX_QUEUED_MESSAGES=32
	-DCYD
	-DCYD_C5
	-DBOARD_HAS_PSRAM
	; esp32-smartdisplay 2.1.1 uses the non-standard `uint` type in its
	; public header (smartdisplay_lcd_set_brightness_cb). It only compiled
	; before because mathieucarbou's WebServer pulled in <sys/types.h>
	; transitively; the ESP32Async fork doesn't. Force-include it.
	-include sys/types.h
	-DWEBSERVER
	-I include
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DLV_FONT_MONTSERRAT_12=1
	-DLV_FONT_MONTSERRAT_14=1
	-DLV_FONT_MONTSERRAT_16=1
	-DLV_FONT_MONTSERRAT_20=1
	-DLV_FONT_MONTSERRAT_28=1
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=16
	-DNO_MQTT
build_unflags =
	-std=gnu++11
lib_deps =

	; ESP32Async fork — properly takes the TCPIP core lock required by
	; ESP-IDF 5.x. mathieucarbou/ESP Async WebServer 2.x triggers
	; "Required to lock TCPIP core functionality!" assert on C5.
	https://github.com/ESP32Async/AsyncTCP.git#v3.4.7
	https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.7.10
	bblanchon/ArduinoJson@^7.0.4
	; Branch develop tiene fixes para ESP-IDF 5.x (issue rzeldent#250).
	; El tag 2.1.1 está congelado en API antiguo (.dc_as_cmd_phase,
	; spi_common_internal.h) y no compila contra pioarduino para C5.
	https://github.com/rzeldent/esp32-smartdisplay.git#develop
	https://github.com/beegee-tokyo/DHTesp.git

[env:cyd_c5_ota]
; CYD_C5 OTA variant
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.36
board = nm_cyd_c5
board_build.partitions = partitions_16MB.csv
board_build.arduino.memory_type = qio_qspi
upload_protocol = espota
upload_port = truminus.local
extra_scripts =
	pre:scripts/patch_pioarduino.py
	pre:scripts/compress_fs.py
build_flags =
	-std=gnu++17
	-Wfatal-errors
	-DCORE_DEBUG_LEVEL=1
	-DWS_MAX_QUEUED_MESSAGES=32
	-DCYD
	-DCYD_C5
	-DBOARD_HAS_PSRAM
	; esp32-smartdisplay 2.1.1 uses the non-standard `uint` type in its
	; public header (smartdisplay_lcd_set_brightness_cb). It only compiled
	; before because mathieucarbou's WebServer pulled in <sys/types.h>
	; transitively; the ESP32Async fork doesn't. Force-include it.
	-include sys/types.h
	-DWEBSERVER
	-I include
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DLV_FONT_MONTSERRAT_12=1
	-DLV_FONT_MONTSERRAT_14=1
	-DLV_FONT_MONTSERRAT_16=1
	-DLV_FONT_MONTSERRAT_20=1
	-DLV_FONT_MONTSERRAT_28=1
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=16
	-DNO_MQTT
build_unflags =
	-std=gnu++11
lib_deps =

	; ESP32Async fork — properly takes the TCPIP core lock required by
	; ESP-IDF 5.x. mathieucarbou/ESP Async WebServer 2.x triggers
	; "Required to lock TCPIP core functionality!" assert on C5.
	https://github.com/ESP32Async/AsyncTCP.git#v3.4.7
	https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.7.10
	bblanchon/ArduinoJson@^7.0.4
	; Branch develop tiene fixes para ESP-IDF 5.x (issue rzeldent#250).
	; El tag 2.1.1 está congelado en API antiguo (.dc_as_cmd_phase,
	; spi_common_internal.h) y no compila contra pioarduino para C5.
	https://github.com/rzeldent/esp32-smartdisplay.git#develop
	https://github.com/beegee-tokyo/DHTesp.git

[env:cyd_ota]
extra_scripts = pre:scripts/compress_fs.py
board = esp32-2432S028R
board_build.partitions = min_spiffs.csv
upload_protocol = espota
upload_port = truminus.local
build_flags =
	-std=gnu++17
	-Wfatal-errors
	-DCORE_DEBUG_LEVEL=1
	-DWS_MAX_QUEUED_MESSAGES=16
	-DCYD
	-DWEBSERVER
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DLV_FONT_MONTSERRAT_12=1
	-DLV_FONT_MONTSERRAT_14=1
	-DLV_FONT_MONTSERRAT_16=1
	-DLV_FONT_MONTSERRAT_20=1
	-DLV_FONT_MONTSERRAT_28=1
	-DLV_MEM_SIZE=32768
	-DLVGL_BUFFER_PIXELS="(DISPLAY_WIDTH*DISPLAY_HEIGHT/10)"
	-DCONFIG_ASYNC_TCP_STACK_SIZE=6144
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=8
	-DNO_MQTT
build_unflags =
	-std=gnu++11
	-DLVGL_BUFFER_PIXELS=(DISPLAY_WIDTH*DISPLAY_HEIGHT/4)
lib_deps =

	mathieucarbou/ESP Async WebServer@^2.9.0
	bblanchon/ArduinoJson@^7.0.4
	; Branch develop tiene fixes para ESP-IDF 5.x (issue rzeldent#250).
	; El tag 2.1.1 está congelado en API antiguo (.dc_as_cmd_phase,
	; spi_common_internal.h) y no compila contra pioarduino para C5.
	https://github.com/rzeldent/esp32-smartdisplay.git#develop
