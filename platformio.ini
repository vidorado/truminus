; PlatformIO Project Configuration File
;
; Only supported board: NM-CYD-C5 (ESP32-C5-WROOM-1, RockBase).
; Ref: https://github.com/RockBase-iot/NM-CYD-C5
;
; Envs:
;   cyd_c5     -> USB upload (/dev/ttyUSB0)
;   cyd_c5_ota -> OTA upload (truminus.local) over WiFi

[env]
; -- Platform and board ----------------------------------------------------
; pioarduino: required for ESP32-C5 / Arduino 3.x (IDF 5.x).
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = nm_cyd_c5
framework = arduino
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
; Enable 8 MB QSPI PSRAM (R8 part of the N16R8 module). Frees internal SRAM
; for the WiFi driver and leaves several MB for BLE / strings / heap.
board_build.arduino.memory_type = qio_qspi

; -- Build -----------------------------------------------------------------
build_type = release
monitor_speed = 115200
monitor_filters = default
; Temporarily on for crash debugging — translates panic backtraces to
; file:line. Revert to `default` once the crash is identified.
;monitor_filters = esp32_exception_decoder

extra_scripts =
	pre:scripts/patch_pioarduino.py
	pre:scripts/cache_bust.py
	pre:scripts/compress_fs.py

build_unflags =
	-std=gnu++11

build_flags =
	-std=gnu++17
	-Wfatal-errors
	; 0 = silent, 1 = errors only, 3 = info.
	; Level 3 floods the serial port and slows async_tcp enough to break
	; the WS handshake. Level 1 is enough to surface panic details
	; without choking the network stack.
	-DCORE_DEBUG_LEVEL=1
	; Per-client WS queue length. Was 32 (too generous), tried 8 (closed
	; client mid-burst when wsConnected() publishes ~15 settings in a
	; row). 16 absorbs the connect burst and stays at ~2.4 KB per client
	; — fine now that LVGL pool is in PSRAM.
	-DWS_MAX_QUEUED_MESSAGES=16
	-DCYD
	-DCYD_C5
	-DBOARD_HAS_PSRAM
	; esp32-smartdisplay 2.1.1 uses the non-standard `uint` type in its
	; public header (smartdisplay_lcd_set_brightness_cb). It used to
	; compile only because mathieucarbou/WebServer pulled in <sys/types.h>;
	; the ESP32Async fork does not, so force the include here.
	-include sys/types.h
	-DWEBSERVER
	-I include
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DLV_FONT_MONTSERRAT_12=1
	-DLV_FONT_MONTSERRAT_14=1
	-DLV_FONT_MONTSERRAT_16=1
	-DLV_FONT_MONTSERRAT_20=1
	-DLV_FONT_MONTSERRAT_28=1
	; AsyncTCP task stack 8192 -> 4096. The task runs all TCP callbacks
	; (accept, recv, sent). For 1-2 clients with small payloads (short
	; WebSocket JSON), 4096 is plenty. Check with `wm` if it gets near 0.
	-DCONFIG_ASYNC_TCP_STACK_SIZE=4096
	; Bumped 8 -> 16 to cope with cache-bust reload bursts (6 HTTP
	; requests in flight + WebSocket events). Was triggering
	; ERR_CONTENT_LENGTH_MISMATCH on the PNG when the queue saturated.
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=16
	; CONFIG_ARDUINO_LOOP_STACK_SIZE does not apply as -D in pioarduino
	; (sdkconfig/Kconfig, frozen at prebuild time). Kept as a reminder:
	; reducing loopTask stack 8192 -> 6144 would require rebuilding
	; esp32-arduino-libs with lib-builder.
	-DNO_MQTT
	; -- Per-category logs (uncomment to enable on serial) ----------------
	;-DLOG_BLE_ENABLED         ; Victron BLE listener
	;-DLOG_ULT_ENABLED         ; Ultimatron BMS
	;-DLOG_BLE_SCAN_ENABLED    ; BLE scan during setup
	;-DLOG_WIFI_ENABLED        ; WiFi events, MAC, IP
	;-DLOG_WIFI_SETUP_ENABLED  ; LVGL WiFi/MQTT setup screen
	;-DLOG_TOUCH_ENABLED       ; Touch calibration
	;-DLOG_OTA_ENABLED         ; Arduino OTA
	;-DLOG_WEB_ENABLED         ; HTTP/WebSocket
	;-DLOG_LIN_ENABLED         ; LIN bus / Truma frames / WaterBoost
	;-DLOG_SETTINGS_ENABLED    ; Settings validation
	;-DLOG_MEM_ENABLED         ; Heap, PSRAM, stack watermarks
	;-DLOG_LVGL_ENABLED        ; LVGL, splash, logo, smartdisplay
	;-DLOG_FS_ENABLED          ; LittleFS
	;-DLOG_SNIFF_ENABLED       ; Raw LIN sniffer
	;-DLOG_AM2301_ENABLED      ; External DHT sensor
	;-DLOG_CLI_ENABLED         ; Serial CLI echo/help
	; -- Dummy data for UI testing (no hardware connected) ----------------
	;-DENABLE_SOLAR_DUMMY      ; Synthetic solar/battery values
	;-DENABLE_BOILER_DUMMY     ; Synthetic boiler temperature
	; -- Note -------------------------------------------------------------
	; CONFIG_ESP32_WIFI_SW_COEXIST_* are sdkconfig (Kconfig) flags frozen
	; into the IDF prebuilt libs — defining them with -D here has no
	; effect. The arbiter is already enabled in the pioarduino prebuild
	; (CONFIG_ESP_COEX_SW_COEXIST_ENABLE=1). Do not add them.

; -- Libraries -------------------------------------------------------------
lib_deps =
	; ESP32Async fork — takes the TCPIP core lock required by IDF 5.x.
	; mathieucarbou/ESP Async WebServer 2.x trips
	; "Required to lock TCPIP core functionality!" assert on C5.
	https://github.com/ESP32Async/AsyncTCP.git#v3.4.7
	https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.7.10
	bblanchon/ArduinoJson@^7.0.4
	h2zero/NimBLE-Arduino@^2.2.3
	; develop branch has fixes for IDF 5.x (rzeldent#250). The 2.1.1 tag
	; is frozen on an older API (.dc_as_cmd_phase, spi_common_internal.h)
	; and does not compile against pioarduino for C5.
	https://github.com/rzeldent/esp32-smartdisplay.git#develop
	https://github.com/beegee-tokyo/DHTesp.git

; --------------------------------------------------------------------------
; Env-specific blocks — only differ in how the firmware is uploaded.
; --------------------------------------------------------------------------

[env:cyd_c5]
; USB upload (USB-C UART CH340C).
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_src_flags = -DENABLE_BLE=1

[env:cyd_c5_ota]
; OTA upload over WiFi to the device at truminus.local.
upload_protocol = espota
upload_port = truminus.local
