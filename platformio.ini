[platformio]
default_envs = jc4880_p4
; ESP-IDF projects don't use PlatformIO's src/ convention;
; the CMakeLists.txt at the root drives everything.
src_dir = main

[env:jc4880_p4]
platform = espressif32
framework = espidf
board = esp32-p4-evboard

; Use the local IDF release/v6.0 instead of PlatformIO's bundled 5.5.4.
; IDF 6.0 is required for ESP32-P4 ECO2 (rev 1.x) silicon support.
; symlink:// avoids copying the multi-GB tree.
platform_packages =
    framework-espidf @ symlink:///home/victor/esp/esp-idf
    toolchain-riscv32-esp @ symlink:///home/victor/.espressif/tools/riscv32-esp-elf/esp-15.2.0_20251204/riscv32-esp-elf

; Delegate build/upload/clean to idf.py via extra_scripts to avoid
; PlatformIO's espidf builder incompatibility with IDF 6.0 linker scripts.
extra_scripts = platformio_idf.py

; Flash/upload
upload_port   = /dev/ttyACM0
upload_speed  = 460800

; Serial monitor
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

[env:jc4880_p4_ota]
extends = jc4880_p4
upload_protocol = espota
upload_port     = truminus.local
