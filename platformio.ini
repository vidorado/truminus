; PlatformIO Project Configuration File
;
; Único board soportado: NM-CYD-C5 (ESP32-C5-WROOM-1, RockBase).
; Ref: https://github.com/RockBase-iot/NM-CYD-C5
;
; Envs:
;   cyd_c5     → upload por USB (/dev/ttyUSB0)
;   cyd_c5_ota → upload OTA (truminus.local) sobre WiFi

[env]
; ── Plataforma y board ─────────────────────────────────────────────────────
; pioarduino: necesario para ESP32-C5 / Arduino 3.x (IDF 5.x).
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = nm_cyd_c5
framework = arduino
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
; Habilita 8 MB QSPI PSRAM (parte R8 del módulo N16R8). Libera SRAM interna
; para el driver WiFi y deja varios MB extra para BLE / strings / heap.
board_build.arduino.memory_type = qio_qspi

; ── Build ──────────────────────────────────────────────────────────────────
build_type = release
monitor_speed = 115200
monitor_filters = default
; Use esp32_exception_decoder only when decoding crash backtraces:
; monitor_filters = esp32_exception_decoder

extra_scripts =
	pre:scripts/patch_pioarduino.py
	pre:scripts/compress_fs.py

build_unflags =
	-std=gnu++11

build_flags =
	-std=gnu++17
	-Wfatal-errors
	-DCORE_DEBUG_LEVEL=0
	-DWS_MAX_QUEUED_MESSAGES=32
	-DCYD
	-DCYD_C5
	-DBOARD_HAS_PSRAM
	; esp32-smartdisplay 2.1.1 usa el tipo no-estándar `uint` en su header
	; público (smartdisplay_lcd_set_brightness_cb). Compilaba antes sólo
	; porque mathieucarbou/WebServer arrastraba <sys/types.h>; el fork de
	; ESP32Async no lo hace, así que lo forzamos aquí.
	-include sys/types.h
	-DWEBSERVER
	-I include
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DLV_FONT_MONTSERRAT_12=1
	-DLV_FONT_MONTSERRAT_14=1
	-DLV_FONT_MONTSERRAT_16=1
	-DLV_FONT_MONTSERRAT_20=1
	-DLV_FONT_MONTSERRAT_28=1
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=16
	-DNO_MQTT
	; ── Logs por categoría (descomenta para activar en serie) ────────────
	;-DLOG_BLE_ENABLED         ; Victron BLE listener
	;-DLOG_ULT_ENABLED         ; Ultimatron BMS
	;-DLOG_BLE_SCAN_ENABLED    ; Escaneo BLE durante setup
	;-DLOG_WIFI_ENABLED        ; Eventos WiFi, MAC, IP
	;-DLOG_WIFI_SETUP_ENABLED  ; Pantalla LVGL de setup WiFi/MQTT
	;-DLOG_TOUCH_ENABLED       ; Calibración táctil
	;-DLOG_OTA_ENABLED         ; Arduino OTA
	;-DLOG_WEB_ENABLED         ; HTTP/WebSocket
	;-DLOG_LIN_ENABLED         ; LIN bus / frames Truma / WaterBoost
	;-DLOG_SETTINGS_ENABLED    ; Validaciones de settings
	;-DLOG_MEM_ENABLED         ; Heap, PSRAM, stack watermarks
	;-DLOG_LVGL_ENABLED        ; LVGL, splash, logo, smartdisplay
	;-DLOG_FS_ENABLED          ; LittleFS
	;-DLOG_SNIFF_ENABLED       ; Sniffer LIN crudo
	;-DLOG_AM2301_ENABLED      ; Sensor exterior DHT
	;-DLOG_CLI_ENABLED         ; Eco/help del CLI serie
	; ── Datos dummy para pruebas de UI (sin hardware conectado) ──────────
	-DENABLE_SOLAR_DUMMY      ; Muestra datos simulados de solar/batería
	-DENABLE_BOILER_DUMMY     ; Muestra temperatura de boiler simulada

; ── Librerías ──────────────────────────────────────────────────────────────
lib_deps =
	; ESP32Async fork — toma el TCPIP core lock requerido por IDF 5.x.
	; mathieucarbou/ESP Async WebServer 2.x dispara
	; "Required to lock TCPIP core functionality!" assert en C5.
	https://github.com/ESP32Async/AsyncTCP.git#v3.4.7
	https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.7.10
	bblanchon/ArduinoJson@^7.0.4
	h2zero/NimBLE-Arduino@^2.2.3
	; Branch develop tiene fixes para IDF 5.x (issue rzeldent#250).
	; El tag 2.1.1 está congelado en API antiguo (.dc_as_cmd_phase,
	; spi_common_internal.h) y no compila contra pioarduino para C5.
	https://github.com/rzeldent/esp32-smartdisplay.git#develop
	https://github.com/beegee-tokyo/DHTesp.git

; ────────────────────────────────────────────────────────────────────────────
; Envs específicos: solo difieren en cómo se sube el firmware.
; ────────────────────────────────────────────────────────────────────────────

[env:cyd_c5]
; Upload por USB (USB-C UART CH340C).
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
; BLE disabled: WiFi/BLE coexistence broken on ESP32-C5 with ESP-IDF 5.5.4
; build_src_flags = -DENABLE_BLE=1

[env:cyd_c5_ota]
; Upload OTA por WiFi al dispositivo en truminus.local.
upload_protocol = espota
upload_port = truminus.local
